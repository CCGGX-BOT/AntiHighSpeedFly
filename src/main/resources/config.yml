# ============================================================
#  AntiHighSpeedFly 反「高速飞行」外挂插件
#
#  设计思路（不是限速，也不是测速）：
#   本插件使用「物理一致性预测」：用游戏自身的水平运动物理
#   （空中阻力0.91/tick、地面摩擦0.546、冰面0.989、输入加速度、
#    飞行/游泳目标速度等）从玩家「上一次被服务端接受的速度」出发，
#    预测本 tick 应有的速度向量，再与实际位移对比。
#    偏差（残差）超过容差 = 物理上不可能的运动 = 违规。
#
#  速度的「上限」由物理模型自然推导，例如：
#    - 空中速度必须按 0.91/次衰减，恒定保持 1 b/t 即产生 0.09 残差；
#    - 地面有输入时必须向「步行×疾跑×速度药水」的目标速度收敛；
#    - 创造飞行速度必须向 flySpeed 属性推导的目标收敛。
#
#  因此 config 里没有「最大速度」这种数字，只有「残差容差」
#  （物理模型允许的误差），调参也不会破坏物理推导逻辑。
# ============================================================

# 总开关
enabled: true

# 只检测这些世界；留空 = 所有世界
worlds: []

physics:
  # —— 物理一致性模型参数 ——
  # 残差容差 (blocks/tick)：实际位移与物理预测之间允许的偏差。
  # 这是模型误差容忍度，不是速度上限。数值越小越严格（误报风险升高），
  # 越大越宽松（可能漏掉低速高速飞）。
  # 注意：鞘翅容差特意放宽到 0.18 —— 俯冲/拉起时速度向量随视角旋转，
  # 水平分量会随总速度增长，属于合法物理现象，需要额外余量。
  residual-tolerance-ground: 0.10
  residual-tolerance-air: 0.08
  residual-tolerance-fly: 0.12
  residual-tolerance-swim: 0.10
  residual-tolerance-glide: 0.18

  # 状态跃迁（落地/起跳/起飞/入水）后的宽限 ms，吸收模型切换瞬时误差
  transition-grace-ms: 150
  # 鞘翅烟花喷射加速后的宽限 ms
  rocket-boost-ms: 400
  # 服务端刚施加较强速度(击退/TNT/激流)后，多长毫秒内容差放大
  velocity-recent-ms: 1000
  # 上述时间窗内容差的放大倍数
  velocity-recent-multiplier: 1.6

suspicion:
  # 连续多少个 tick 违规后才开始处理（抗单次卡顿/瞬间位移误报）
  require-consecutive-violations: 2

  # 怀疑度阈值：警告 / 回退位置 / 踢出
  warn-at: 5.0
  setback-at: 15.0
  kick-at: 40.0

  # 两次回退之间的最小间隔 ms
  setback-cooldown-ms: 1500

  # 警告阶段是否同时取消本次移动（客户端会被拉回原位）
  cancel-on-warn: true

  # 怀疑度每秒自然衰减（无违规时逐渐清零，防止永久标记）
  decay-per-second: 0.4

punishments:
  # 达到 kick-at 阈值后是否踢出
  kick-enabled: true

alerts:
  # 是否向拥有 antihighspeedfly.alert 权限的玩家发送疑似违规提示
  notify-staff: true
  # 同一玩家两次提示的最小间隔 ms
  cooldown-ms: 5000

messages:
  warn: "&c⚠ 检测到异常移动，请停止！"
  setback: "&c⚠ 检测到高速飞行外挂，已回退位置！"
  kick: "&c检测到高速飞行外挂 (SpeedFly)\n&7如为误判，请联系管理员申诉"
